# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - build-essential
    - ninja-build
    - fonts-inconsolata
  jobs:
    pre_build:
      # Solver libraries at their vendor.lock versions, as in scripts/build_docs.sh.
      # The -I paths are absolute: mzn2doc cannot load *.deprecated.mzn through relative ones.
      - bash scripts/fetch_vendor.sh x86_64-linux-gnu gecode chuffed
      - cmake -S . -B build -G"Ninja" -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build --target mzn2doc
      - ./build/mzn2doc -I "$PWD/share/minizinc/std" -I "$PWD/vendor/gecode/share/minizinc/gecode" -I "$PWD/vendor/chuffed/share/minizinc/chuffed" --rst-output --include-stdlib --output-base docs/en/lib docs/all.mzn
      - ./build/mzn2doc -I "$PWD/share/minizinc/std" -I "$PWD/vendor/gecode/share/minizinc/gecode" -I "$PWD/vendor/chuffed/share/minizinc/chuffed" --rst-output --include-stdlib --output-base docs/chi/lib docs/all.mzn

sphinx:
  configuration: docs/en/conf.py

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
