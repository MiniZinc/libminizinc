# Read the Docs configuration file for Sphinx projects
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

build:
  os: ubuntu-22.04
  tools:
    python: "3.12"
  apt_packages:
    - cmake
    - build-essential
    - ninja-build
    - fonts-inconsolata
  jobs:
    pre_build:
      # gecode.mzn and chuffed.mzn at their vendor.lock versions, as in scripts/build_docs.sh
      - bash scripts/fetch_vendor.sh x86_64-linux-gnu gecode chuffed
      - cp vendor/gecode/share/minizinc/gecode/gecode.mzn vendor/chuffed/share/minizinc/chuffed/chuffed.mzn share/minizinc/std/
      - cmake -S . -B build -G"Ninja" -DCMAKE_BUILD_TYPE=Debug
      - cmake --build build --target mzn2doc
      - ./build/mzn2doc --rst-output --include-stdlib --output-base docs/en/lib docs/all.mzn
      - ./build/mzn2doc --rst-output --include-stdlib --output-base docs/chi/lib docs/all.mzn

sphinx:
  configuration: docs/en/conf.py

formats:
  - pdf

python:
  install:
    - requirements: docs/requirements.txt
